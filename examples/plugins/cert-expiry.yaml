apiVersion: jumper/v1
kind: Plugin
name: cert-expiry
description: days until each local PEM certificate expires
target: host
command: |
  for f in /etc/ssl/certs/*.pem; do
    [ -f "$f" ] || continue
    end=$(openssl x509 -enddate -noout -in "$f" 2>/dev/null | cut -d= -f2)
    [ -n "$end" ] || continue
    days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
    printf '%s\t%s\t%d\n' "$f" "$end" "$days"
  done
parse:
  type: columns
  names: [certificate, expires, days]
view:
  columns: [certificate, expires, days]
links:
  - label: host overview
    to: host-overview
