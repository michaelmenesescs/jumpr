# jumper configuration for the local test lab (SPEC §22).
#
# Use it with:
#
#   go run ./cmd/sitrep-lab up
#   ./jumper doctor ssh web-01.lab.example.internal --config-dir lab/jumper
#
# Paths in a config file are used exactly as written, except that a leading
# "~/" is expanded to the home directory: relative paths (lab/ssh_config,
# lab/.knowledge, …) resolve against the current working directory. Run jumper
# from the repository root, or pass a --config-dir that points at an absolute
# path.
#
# lab/ssh_config and lab/.keys/ are generated by the lab controller and are
# git-ignored; lab/ssh_config itself is not a secret (it holds lab-only
# addresses and a locally generated key path).

ssh:
  config_files: [lab/ssh_config]
  # The fan-out stress test (internal/transport/ssh/lab_test.go) asserts these
  # exactly, so the lab exercises the same limits production would.
  max_conns_per_bastion: 2
  max_channels_per_conn: 4
  # A tiny keepalive so a lab test sees a dead connection as dead quickly.
  keepalive: 15s

inventory:
  sources:
    - type: ssh_config
    # Grains from the master's cache: adds the salt.* labels (salt.role, salt.dc,
    # salt.os) the M4 demo selectors (`:hosts salt.role=web`) use. Read over SSH,
    # never from the minions.
    - type: salt

salt:
  master: salt.lab.example.internal

knowledge:
  root: lab/.knowledge

# The lab's observability stack (SPEC §22) sits behind the mock SSO proxy of
# `connections.yaml`; both entries use the `lab-sso` profile, so the auth helper
# is what makes them reachable. The M8 tests are internal/backend/prom/lab_test.go.
prometheus:
  - name: lab
    url: https://prom.lab.example.internal
    connection: lab-sso

alertmanager:
  - name: lab
    url: https://am.lab.example.internal
    connection: lab-sso

# The same stack also serves dashboards and central logs: the M11 tests are
# internal/backend/grafana/lab_test.go and internal/backend/elastic/lab_test.go.
grafana:
  - name: lab
    url: https://grafana.lab.example.internal
    connection: lab-sso

elasticsearch:
  - name: lab
    url: https://es.lab.example.internal
    connection: lab-sso
    sources:
      # The field names are the Elastic Common Schema ones, which is what a
      # Filebeat/journald shipper writes by default. `unit_field` is what a unit
      # detail's `l` filters on; drop it for a source that logs no unit.
      - name: nginx
        index: logs-nginx-*
        time_field: "@timestamp"
        host_field: host.name
        message_field: message
        level_field: log.level
        unit_field: systemd.unit
      - name: system
        index: logs-system-*
        time_field: "@timestamp"
        host_field: host.name
        message_field: message
        level_field: log.level
        unit_field: systemd.unit
